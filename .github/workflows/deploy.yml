# WP-6.4 — Deploy pipeline.
#
# Scope: DEPLOY ONLY. Lint, typecheck, unit tests, e2e and `next build` are
# already gated by .github/workflows/ci.yml on every push/PR, so nothing is
# re-run here. (An earlier draft of this file re-ran them AND called npm scripts
# that do not exist in package.json: `type-check`, `migrate:test`, `migrate:staging`,
# `migrate:prod`, `test:ci`, `test:smoke`, `test:sanity`, `db:verify`. Every
# command below is a real script or a plain curl.)
#
# Secrets required (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   DATABASE_URL_STAGING, DATABASE_URL_PRODUCTION     (already set)
# Optional repo variable: vars.APP_URL. When unset, the smoke check uses the
# production alias that `vercel deploy --prod` reports for this deployment.

name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    outputs:
      # Step outputs are NOT visible through needs.<job>.outputs.<name> until the
      # job maps them here. Without this line the verify job received an empty
      # PROD_URL even though the deploy step had written $GITHUB_OUTPUT, and the
      # smoke check failed with "no production URL" (run 44775795010).
      prod_url: ${{ steps.deploy.outputs.prod_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Fail with one readable line instead of a vercel CLI stack trace.
      - name: Check Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error missing repository secrets:$missing"; exit 1
          fi
          echo "Vercel secrets present"

      - name: Install dependencies
        run: npm ci

      # Migrations run BEFORE the new bundle goes live. The agent routes read
      # columns the previous build never wrote, so a deployed-but-unmigrated app
      # would 500 on /api/agents/chat.
      - name: Database migrations
        env:
          DATABASE_URL: ${{ github.ref_name == 'main' && secrets.DATABASE_URL_PRODUCTION || secrets.DATABASE_URL_STAGING }}
        run: npm run db:migrate

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # `vercel deploy --prod` prints two hosts. Only the alias line is
          # usable by a smoke check:
          #   ▲ Aliased         https://one-table-gamma.vercel.app   <- public
          #   Production        https://one-table-<id>-<team>.vercel.app
          # The per-deployment host sits behind Vercel deployment protection and
          # answers 302 to unauthenticated requests, so probing it reports a
          # healthy deployment as broken.
          if ! out="$(npx vercel deploy --prod --token="$VERCEL_TOKEN" --yes 2>&1)"; then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out"
          alias_url="$(printf '%s\n' "$out" \
            | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\x1b\][^\x07]*\x07//g' \
            | awk '/Aliased/ { for (i = 1; i <= NF; i++) if ($i ~ /^https:\/\//) { print $i; exit } }')"
          # Vercel's progress lines use CSI forms that end in K/A/G (erase line,
          # cursor up, cursor to column), not just the colour sequences ending in
          # m, so a `[0-9;]*m` strip leaves control bytes glued to the fields.
          if [ -z "$alias_url" ]; then
            echo "::warning::could not parse a production alias from the deploy output; the smoke check will fall back to vars.APP_URL"
          fi
          echo "parsed prod_url=$alias_url"
          echo "prod_url=$alias_url" >> "$GITHUB_OUTPUT"

  verify:
    name: Smoke check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref_name == 'main'
    env:
      # The alias Vercel reported for this deployment. vars.APP_URL remains an
      # explicit override for a custom domain. There is deliberately no
      # built-in default: the previous one (https://onetable.app) was a
      # placeholder that is not this project, so the check failed with 404
      # against somebody else's host and hid the real state of the deployment.
      URL_OVERRIDE: ${{ vars.APP_URL }}
      PROD_URL: ${{ needs.deploy.outputs.prod_url }}
    steps:
      - name: Wait for /api/health to answer
        run: |
          set -uo pipefail
          url="${PROD_URL:-$URL_OVERRIDE}"
          if [ -z "$url" ]; then
            echo "::error no production URL: deploy reported no alias and vars.APP_URL is unset"
            exit 1
          fi
          echo "probing $url"
          for i in $(seq 1 20); do
            body="$(curl -s -m 20 "$url/api/health" || true)"
            code="$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$url/api/health" || echo 000)"
            echo "attempt $i -> $code ${body}"
            # The body is a fixed status object with no secrets in it, and
            # logging it is what distinguishes "route missing" from "database
            # unreachable" — a bare status code did not, last run.
            case "$code" in
              200) echo "healthy"; exit 0 ;;
              404|000) ;; # not up yet, keep polling
              *) sleep 15 ;;
            esac
          done
          echo "::error $url/api/health never returned 200 (last: $code ${body})"
          exit 1

      # A 404 means the route never shipped. 401 is the expected answer here:
      # these routes require a session and the check sends none.
      - name: Agent routes are mounted
        run: |
          set -uo pipefail
          url="${PROD_URL:-$URL_OVERRIDE}"
          [ -n "$url" ] || { echo "::error no production URL"; exit 1; }
          fail=0
          for path in /api/approvals /api/actions /api/insights; do
            code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$url$path")
            echo "$path -> $code"
            if [ "$code" = "404" ] || [ "$code" = "000" ]; then
              echo "::error $path is not mounted"; fail=1
            fi
          done
          exit $fail
