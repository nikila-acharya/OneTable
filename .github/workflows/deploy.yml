# WP-6.4 — Deploy pipeline.
#
# Scope: DEPLOY ONLY. Lint, typecheck, unit tests, e2e and `next build` are
# already gated by .github/workflows/ci.yml on every push/PR, so nothing is
# re-run here. (An earlier draft of this file re-ran them AND called npm scripts
# that do not exist in package.json: `type-check`, `migrate:test`, `migrate:staging`,
# `migrate:prod`, `test:ci`, `test:smoke`, `test:sanity`, `db:verify`. Every
# command below is a real script or a plain curl.)
#
# Secrets required (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   DATABASE_URL_STAGING, DATABASE_URL_PRODUCTION     (already set)
# Optional repo variable: vars.APP_URL (defaults to https://onetable.app)

name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Fail with one readable line instead of a vercel CLI stack trace.
      - name: Check Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error missing repository secrets:$missing"; exit 1
          fi
          echo "Vercel secrets present"

      - name: Install dependencies
        run: npm ci

      # Migrations run BEFORE the new bundle goes live. The agent routes read
      # columns the previous build never wrote, so a deployed-but-unmigrated app
      # would 500 on /api/agents/chat.
      - name: Database migrations
        env:
          DATABASE_URL: ${{ github.ref_name == 'main' && secrets.DATABASE_URL_PRODUCTION || secrets.DATABASE_URL_STAGING }}
        run: npm run db:migrate

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --token="$VERCEL_TOKEN" --yes

  verify:
    name: Smoke check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref_name == 'main'
    steps:
      - name: Wait for /api/health to answer
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          url="${APP_URL:-https://onetable.app}"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/health" || echo 000)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && echo "healthy" && exit 0
            sleep 15
          done
          echo "::error $url/api/health never returned 200 (last: $code)"
          exit 1

      # A 404 means the route never shipped. 401 is the expected answer here:
      # these routes require a session and the check sends none.
      - name: Agent routes are mounted
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          url="${APP_URL:-https://onetable.app}"
          fail=0
          for path in /api/approvals /api/actions /api/insights; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url$path")
            echo "$path -> $code"
            if [ "$code" = "404" ] || [ "$code" = "000" ]; then
              echo "::error $path is not mounted"; fail=1
            fi
          done
          exit $fail
